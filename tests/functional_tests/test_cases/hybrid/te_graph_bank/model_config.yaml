# This is a preflight contract, not a registered functional test. The current
# functional runner cannot expand one model config into a CUDA-graph scope
# matrix, change the runtime microbatch count non-monotonically, or allocate
# this 16-rank/4-node topology. Register it only after those capabilities exist.
REGISTRATION:
  status: blocked
  required_world_size: 16
  required_nodes: 4
  required_gpus_per_node: 4
  runner_gaps:
    - expand CUDA_GRAPH_MATRIX.scopes and CUDA_GRAPH_MATRIX.variants
    - execute CUDA_GRAPH_MATRIX.schedule without restarting the process
    - assert graph-bank capture, replay, fallback, and reset telemetry

CUDA_GRAPH_MATRIX:
  topology:
    tensor_model_parallel_size: 2
    pipeline_model_parallel_size: 2
    context_parallel_size: 2
    expert_model_parallel_size: 8
    expert_tensor_parallel_size: 1
    world_size: 16
    nodes: 4
    gpus_per_node: 4
  packed_sequence:
    enabled: true
    max_sequences_per_pack: 16
  schedule:
    - steps: [1, 2, 3]
      mode: eager_warmup
    - steps: [4]
      num_microbatches: 5
      expected_action: capture
    - steps: [5, 6]
      num_microbatches: 3
      expected_action: capture_then_replay
    - steps: [7]
      num_microbatches: 5
      expected_action: cached_replay
  expected_telemetry:
    capture_counts:
      5: 1
      3: 1
    fallback_count: 0
    reset_count_per_bank: 1
  scopes:
    - []
    - [attn]
    - [mlp]
    - [attn, mlp]
    - [mamba]
    - [mlp, mamba]
    - [mamba, moe]
    - [mamba, moe_router, moe_preprocess]
    - [moe_router, moe_preprocess]
    - [attn, mamba, moe_router, moe_preprocess]
  full_moe_contract:
    expert_capacity_factor: 1.0
    pad_expert_input_to_capacity: true
  variants:
    scopes:
      - [mamba, moe]
      - [moe_router, moe_preprocess]
    axes:
      moe_shared_expert_overlap: [false, true]
      selective_recompute_modules:
        - []
        - [moe_act]
    grouped_gemm_for_moe_act: true
    overlap_moe_expert_parallel_comm: false
    forbidden_crosses:
      - moe_shared_expert_overlap with overlap_moe_expert_parallel_comm
  forbidden_independent_scopes:
    - moe_act
    - shared_expert

ENV_VARS:
  CUDA_DEVICE_MAX_CONNECTIONS: 1
  NVTE_ALLOW_NONDETERMINISTIC_ALGO: 0
  CUBLAS_WORKSPACE_CONFIG: ":4096:8"

# Representative runnable arguments for a future matrix-aware harness. The
# harness must override --cuda-graph-modules, shared-expert overlap, selective
# recompute, and the global batch size according to CUDA_GRAPH_MATRIX.
MODEL_ARGS:
  --num-layers: 8
  --hidden-size: 256
  --ffn-hidden-size: 512
  --num-attention-heads: 8
  --hybrid-layer-pattern: "M*E-|M*E-"
  --position-embedding-type: none
  --untie-embeddings-and-output-weights: true
  --disable-bias-linear: true
  --attention-dropout: 0.0
  --hidden-dropout: 0.0
  --deterministic-mode: true
  --bf16: true
  --micro-batch-size: 1
  --global-batch-size: 10
  --seq-length: 32
  --max-position-embeddings: 32
  --train-iters: 7
  --tensor-model-parallel-size: 2
  --pipeline-model-parallel-size: 2
  --context-parallel-size: 2
  --expert-model-parallel-size: 8
  --expert-tensor-parallel-size: 1
  --sequence-parallel: true
  --num-experts: 8
  --moe-router-topk: 1
  --moe-router-load-balancing-type: none
  --moe-token-dispatcher-type: alltoall
  --moe-grouped-gemm: true
  --moe-expert-capacity-factor: 1.0
  --moe-pad-expert-input-to-capacity: true
  --moe-shared-expert-intermediate-size: 256
  --dataloader-inter-document-masking: true
  --transformer-impl: transformer_engine
  --cuda-graph-impl: transformer_engine
  --cuda-graph-modules: "[mamba moe]"
  --cuda-graph-warmup-steps: 1
  --distributed-backend: nccl
  --lr: 1.0e-4
  --lr-decay-style: constant
  --lr-decay-iters: 7
  --min-lr: 1.0e-4
  --weight-decay: 0.0
  --clip-grad: 1.0
  --split: 949,50,1
  --data-path: ${DATA_PATH}/text/common_pile/v01_filtered_data/my-gpt3_00_text_document
  --data-cache-path: ${DATA_CACHE_PATH}
  --vocab-file: ${DATA_PATH}/text/common_pile/v01_filtered_data/bpe/vocab.json
  --merge-file: ${DATA_PATH}/text/common_pile/v01_filtered_data/bpe/merges.txt
  --log-interval: 1
  --eval-interval: 1000
  --eval-iters: 0

TEST_TYPE: regular
METRICS:
  - lm loss
