__class__: MetadatasetV2
__module__: megatron.energon
splits:
  train:
    blend_epochized:
      # Base vision data
      - path: /lustre/fsw/portfolios/llmservice/users/amalasanjayd/eagle_recipe/online_packing/eagle_sft_v13.77_safetyfix.yaml
        repetitions: 1
      # Extra video data from Arushi
      - path: /lustre/fsw/portfolios/llmservice/users/amalasanjayd/eagle_recipe/online_packing/short_video_qa_0318_newreps.yaml
        repetitions: 1.0
      - path: /lustre/fsw/portfolios/llmservice/users/amalasanjayd/eagle_recipe/online_packing/video_qa_v1_v2_all_0314_safetyfix.yaml
        repetitions: 1.0
      ## Qwen3.5 video reasoning
      - path: /lustre/fsw/portfolios/llmservice/users/amalasanjayd/eagle_recipe/online_packing/mar4_video_qa_short_reasoning_newreps.yaml
        repetitions: 1.0
      - path: /lustre/fsw/portfolios/llmservice/projects/llmservice_fm_vision/datasets/avlm/video_audio_raw/PLM_video_data/reasoning/yt1b_qa_plm_sampled_thinking_traces_safetyfix0323.jsonl
        subflavors:
          cook: general_conversations_jsonl
        aux:
          media_source: filesystem:///lustre/fs1/portfolios/llmservice/projects/llmservice_fm_vision/users/ntadevosyan/data/yttemporal180m-youtube-dataset/
        repetitions: 1.0
      ## Correct data, Yt1B PLM QA 900k sample dense captions with thinking traces
      - path: /lustre/fsw/portfolios/llmservice/projects/llmservice_fm_vision/datasets/avlm/video_audio_raw/PLM_video_data/reasoning/yt1b_qa_plm_sampled_dense_captions_no_think_safetyfix0323.jsonl
        subflavors:
          cook: general_conversations_jsonl
        aux:
          media_source: filesystem:///lustre/fs1/portfolios/llmservice/projects/llmservice_fm_vision/users/ntadevosyan/data/yttemporal180m-youtube-dataset/
        repetitions: 1.0
      ## Additional data from Arushi (TODO: reduce reps?)
      - path: /lustre/fsw/portfolios/llmservice/users/amalasanjayd/eagle_recipe/online_packing/short_dense_captions_no_think_0310_safetyfix.yaml
        repetitions: 1
      # Text data from Matthieu (18.9M samples -> 3786 tokens per sample -> 71B tokens); updated to use abs paths
      - path: /lustre/fsw/portfolios/llmservice/users/cmccarthy/eagle_recipe_online_packing/final_recipe/nickel_capybara_0_16k_abspath.yaml
        repetitions: 0.25
      # Safety data
      - path: /lustre/fsw/portfolios/llmservice/projects/llmservice_fm_vision/datasets/avlm/video_audio_raw/safety/filtered_textsafety_energon_dataset.jsonl
        subflavors:
          cook: general_conversations_jsonl
        repetitions: 2
      - path: /lustre/fsw/portfolios/llmservice/projects/llmservice_fm_vision/datasets/avlm/video_audio_raw/safety/image_safety_energon_dataset.jsonl
        subflavors:
          cook: general_conversations_jsonl
        repetitions: 2
      # SFT-0.5 addmix: benchfit_qa
      - repetitions: 0.6
        path: /lustre/fsw/portfolios/llmservice/projects/llmservice_fm_vision/datasets/sft-0.5/mint_200/benchfit_qa/03-10a_stage5_output.jsonl
        subflavors:
          name: benchfit_qa
          cook: conversation
        aux:
          media_source: /lustre/fsw/portfolios/llmservice/projects/llmservice_fm_vision/datasets/sft-0.5/mint_200/input/image_shards
      # SFT-0.5 addmix: dense_ocr_qa
      - repetitions: 0.6
        path: /lustre/fsw/portfolios/llmservice/projects/llmservice_fm_vision/datasets/sft-0.5/mint_30/dense_ocr/03-10a_stage5_qa_output.jsonl
        subflavors:
          name: dense_ocr_qa
          cook: conversation
        aux:
          media_source: /lustre/fsw/portfolios/llmservice/projects/llmservice_fm_vision/datasets/sft-0.5/mint_200/input/image_shards

