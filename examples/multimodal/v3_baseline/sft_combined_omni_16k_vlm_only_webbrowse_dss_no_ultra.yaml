# Web-browsing derivative of:
# Derived from examples/multimodal/nano_v35/unification/sft_combined_omni_16k_vlm_only.yaml.
# Excludes the ultra text data from the nested VLM-only mix.
__class__: MetadatasetV2
__module__: megatron.energon
splits:
  train:
    blend_epochized:
      - path:
          sft_combined_omni_16k_vlm_only_webbrowse_dss/sft_combined_omni_16k_vlm_only_no_ultra_text.yaml
        repetitions: 1

      # Web-browsing / agent data: Holotron distilled MolmoWeb (perplexity v2)
      - path:
          sft_combined_omni_16k_vlm_only_webbrowse_dss/data_yamls/perplexity_holotron_distilled_molmoweb_v2.yaml
        repetitions: 0.5

      # Web-browsing / agent data: Holotron a3 webarea distilled SFT (momoweb success)
      - path:
          sft_combined_omni_16k_vlm_only_webbrowse_dss/data_yamls/holotron_a3_webarea_success_momoweb_energon.yaml
        repetitions: 0.5
