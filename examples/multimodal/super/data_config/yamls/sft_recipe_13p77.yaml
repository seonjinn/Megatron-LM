__class__: MetadatasetV2
__module__: megatron.energon
splits:
  train:
    blend_epochized:
      # Base vision data
      - path: eagle_sft_v13.77_safetyfix.yaml
        repetitions: 1
      # Text data 
      - path: /lustre/fsw/portfolios/llmservice/projects/llmservice_nlp_fm/datasets/ultra-sft/epoch-0-032026-energon/ultra_txt_materialized_0407_median_le_16384.yaml
        repetitions: 0.25
      # Safety data
      - path: /lustre/fsw/portfolios/llmservice/projects/llmservice_nlp_fm/datasets/eagle-next/omni_stage/datasets/safety/filtered_textsafety_energon_dataset.jsonl
        subflavors:
          cook: general_conversations_jsonl
        repetitions: 2
      - path: /lustre/fsw/portfolios/llmservice/projects/llmservice_nlp_fm/datasets/eagle-next/omni_stage/datasets/fixed_datasets/safety/nemotron_omni_safety_image_text_sft_blend_v0.1.0.jsonl
        aux:
          media_source: filesystem:///lustre/fsw/portfolios/llmservice/projects/llmservice_nlp_fm/datasets/eagle-next/omni_stage/media_sources/omni_data/data/images
        subflavors:
          cook: general_conversations_jsonl
        repetitions: 2
      # SFT-0.5 addmix: benchfit_qa
      - repetitions: 0.6
        path: /lustre/fsw/portfolios/llmservice/projects/llmservice_nlp_fm/datasets/eagle-next/omni_stage/datasets/benchfit_qa/03-10a_stage5_output.jsonl
        subflavors:
          name: benchfit_qa
          cook: conversation
        aux:
          media_source: /lustre/fsw/portfolios/llmservice/projects/llmservice_nlp_fm/datasets/eagle-next/omni_stage/media_sources/sft-0.5/mint_200/input/image_shards
      # SFT-0.5 addmix: dense_ocr_qa
      - repetitions: 0.6
        path: /lustre/fsw/portfolios/llmservice/projects/llmservice_nlp_fm/datasets/eagle-next/omni_stage/datasets/dense_ocr/03-10a_stage5_qa_output.jsonl
        subflavors:
          name: dense_ocr_qa
          cook: conversation
        aux:
          media_source: /lustre/fsw/portfolios/llmservice/projects/llmservice_nlp_fm/datasets/eagle-next/omni_stage/media_sources/sft-0.5/mint_200/input/image_shards
      # Short video data 
      - path: short_video_qa_0318_newreps.yaml
        repetitions: 1
      - path: video_qa_v1_v2_all_0314_safetyfix.yaml
        repetitions: 1
      # Qwen3.5 video reasoning
      - path: mar4_video_qa_short_reasoning_newreps.yaml
        repetitions: 1.0
      - path: /lustre/fsw/portfolios/llmservice/projects/llmservice_nlp_fm/datasets/eagle-next/omni_stage/datasets/PLM_video_data/reasoning/yt1b_qa_plm_sampled_thinking_traces_safetyfix0323.jsonl
        subflavors:
          cook: general_conversations_jsonl
        aux:
          media_source: filesystem:///lustre/fsw/portfolios/llmservice/projects/llmservice_nlp_fm/datasets/eagle-next/omni_stage/media_sources/yttemporal180m-youtube-dataset
        repetitions: 1.0
      # Correct data, Yt1B PLM QA sample dense captions with thinking traces
      - path: /lustre/fsw/portfolios/llmservice/projects/llmservice_nlp_fm/datasets/eagle-next/omni_stage/datasets/PLM_video_data/reasoning/yt1b_qa_plm_sampled_dense_captions_no_think_safetyfix0323.jsonl
        subflavors:
          cook: general_conversations_jsonl
        aux:
          media_source: filesystem:///lustre/fsw/portfolios/llmservice/projects/llmservice_nlp_fm/datasets/eagle-next/omni_stage/media_sources/yttemporal180m-youtube-dataset
        repetitions: 1.0
      # Additional data from Arushi
      - path: short_dense_captions_no_think_0310_safetyfix.yaml
        repetitions: 1
      # Short omni data
      - path: arushi_short16k_omni_qa_0220.yaml
        repetitions: 1.0 
      - path: gemini_filtered_omni_qa_short16k_0222.yaml
        repetitions: 0.5
      - path: omni_caption_short16k_0220.yaml
        repetitions: 1.0 
      # ASR: Granary Small
      - path: granary_v1.1_small.yaml
        repetitions: 1.0 
      # Granary
      - path: granary.v1_1.yaml
        repetitions: 0.05 
      # Audio reasoning data
      - path: audio_reasoning_sft_nano3_filtered_rep1.yaml
        repetitions: 3.0
      - path: /lustre/fsw/portfolios/llmservice/projects/llmservice_nlp_fm/datasets/eagle-next/omni_stage/datasets/bbh_logical_reasoning/train_bbh_logical_reasoning.jsonl
        repetitions: 1.5
        subflavors:
          cook: general_conversations_jsonl
        aux:
          media_source: filesystem:///lustre/fsw/portfolios/llmservice/projects/llmservice_nlp_fm/datasets/eagle-next/omni_stage/media_sources/bbh_logical_reasoning/audio
      - path: /lustre/fsw/portfolios/llmservice/projects/llmservice_nlp_fm/datasets/eagle-next/omni_stage/datasets/bbh_spatial_reasoning/train_bbh_spatial_reasoning.jsonl
        repetitions: 1.5
        subflavors:
          cook: general_conversations_jsonl
        aux:
          media_source: filesystem:///lustre/fsw/portfolios/llmservice/projects/llmservice_nlp_fm/datasets/eagle-next/omni_stage/media_sources/bbh_spatial_reasoning/audio
      # # #########################################################
      # # # Audio-SFT
      # # #########################################################
      - path: sft.audio.leili.0317.yaml
        repetitions: 1
      # AudioReasoning (MMAU benchmark)
      - path: audio_reasoning.mmau.0316.yaml
        repetitions: 1


