__class__: MetadatasetV2
__module__: megatron.energon
splits:
  train:
    blend_epochized:
      # Base vision data
      - path: eagle_sft_v13.77_safetyfix.yaml
        repetitions: 1
      # Extra video data from Arushi
      - path: short_video_qa_0318_newreps.yaml
        repetitions: 1.0
      - path: video_qa_v1_v2_all_0314_safetyfix.yaml
        repetitions: 1.0
      ## Qwen3.5 video reasoning
      - path: mar4_video_qa_short_reasoning_newreps.yaml
        repetitions: 1.0
      - path: /lustre/fsw/portfolios/llmservice/projects/llmservice_nlp_fm/datasets/eagle-next/omni_stage/datasets/PLM_video_data/reasoning/yt1b_qa_plm_sampled_thinking_traces_safetyfix0323.jsonl
