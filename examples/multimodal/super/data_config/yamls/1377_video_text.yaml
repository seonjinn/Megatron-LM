          cook: general_conversations_jsonl
        aux:
          media_source: filesystem:///lustre/fsw/portfolios/llmservice/projects/llmservice_nlp_fm/datasets/eagle-next/omni_stage/media_sources/yttemporal180m-youtube-dataset
        repetitions: 1.0
      ## Correct data, Yt1B PLM QA 900k sample dense captions with thinking traces
      - path: /lustre/fsw/portfolios/llmservice/projects/llmservice_nlp_fm/datasets/eagle-next/omni_stage/datasets/PLM_video_data/reasoning/yt1b_qa_plm_sampled_dense_captions_no_think_safetyfix0323.jsonl
        subflavors:
          cook: general_conversations_jsonl
        aux:
          media_source: filesystem:///lustre/fsw/portfolios/llmservice/projects/llmservice_nlp_fm/datasets/eagle-next/omni_stage/media_sources/yttemporal180m-youtube-dataset
        repetitions: 1.0
      ## Additional data from Arushi (TODO: reduce reps?)
      - path: short_dense_captions_no_think_0310_safetyfix.yaml
        repetitions: 1
      # Text data from Matthieu (18.9M samples -> 3786 tokens per sample -> 71B tokens); updated to use abs paths
      - path: /lustre/fsw/portfolios/llmservice/projects/llmservice_nlp_fm/datasets/ultra-sft/epoch-0-032026-energon/ultra_txt_materialized_0407_median_le_16384.yaml
        repetitions: 0.25
