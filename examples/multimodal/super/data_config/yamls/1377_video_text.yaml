          name: dense_ocr_qa
          cook: conversation
        aux:
          media_source: /lustre/fsw/portfolios/llmservice/projects/llmservice_nlp_fm/datasets/eagle-next/omni_stage/media_sources/sft-0.5/mint_200/input/image_shards
