        subflavors:
          cook: general_conversations_jsonl
        repetitions: 2
      # SFT-0.5 addmix: benchfit_qa
      - repetitions: 0.6
        path: /lustre/fsw/portfolios/llmservice/projects/llmservice_nlp_fm/datasets/eagle-next/omni_stage/datasets/benchfit_qa/03-10a_stage5_output.jsonl
