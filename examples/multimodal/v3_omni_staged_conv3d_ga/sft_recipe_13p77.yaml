splits:
  train:
    blend_epochized:
      # Base vision data
      - path: /lustre/fsw/portfolios/llmservice/users/amalasanjayd/eagle_recipe/online_packing/eagle_sft_v13.77_safetyfix.yaml
        repetitions: 1
      # Text data
