#
# Retains the combined recipe's image, video, and text entries and weights.
# Inside eagle_sft_v14, replaces its CharXiv child with the judge-filtered mix.
# Removes short-omni, ASR, audio-reasoning, and audio-SFT entries.
# Adds the additional-charts and Hopchain mixes at weight 1.0 each.
__class__: MetadatasetV2
__module__: megatron.energon
splits:
  train:
    blend_epochized:
      # Base Eagle v14 vision mix with judge-filtered CharXiv substituted inside
      - path: eagle_sft_v14_nano_charxiv.yaml
        repetitions: 1.2

      # Short video QA data
      - path: /lustre/fsw/portfolios/llmservice/users/matthieul/data/omni_data_recipes/includes/users/amalasanjayd/eagle_recipe/online_packing/short_video_qa_0318_newreps.yaml
