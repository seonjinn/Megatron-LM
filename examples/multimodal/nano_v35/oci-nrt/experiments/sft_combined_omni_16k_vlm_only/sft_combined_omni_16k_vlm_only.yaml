      - path: /lustre/fsw/portfolios/llmservice/users/matthieul/data/omni_data_recipes/includes/users/amalasanjayd/eagle_recipe/online_packing/video_qa_v1_v2_all_0314_safetyfix.yaml
        repetitions: 1.2

      # Qwen3.5 video reasoning
      - path: /lustre/fsw/portfolios/llmservice/users/matthieul/data/omni_data_recipes/includes/users/amalasanjayd/eagle_recipe/online_packing/mar4_video_qa_short_reasoning_newreps.yaml
        repetitions: 1.2
      - path: /lustre/fsw/portfolios/llmservice/projects/llmservice_fm_vision/datasets/avlm/video_audio_raw/PLM_video_data/reasoning/yt1b_qa_plm_sampled_thinking_traces_safetyfix0323.jsonl
